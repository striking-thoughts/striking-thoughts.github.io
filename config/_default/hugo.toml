publishDir = "docs"
theme = "striking-thoughts-lab"
baseURL = "https://www.strikingthoughts.io/"
defaultContentLanguage = "en"
title = "Striking Thoughts"
enableRobotsTXT = true
enableEmoji = true
summaryLength = 34

[pagination]
  pagerSize = 100

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]

[imaging]
  anchor = "Center"
  quality = 86

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5
